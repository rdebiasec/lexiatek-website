# Intake API CI — dependency audit (Python)
name: Intake API CI

on:
  push:
    branches: [main]
    paths:
      - 'intake-api/**'
      - '.github/workflows/intake-api-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'intake-api/**'
      - '.github/workflows/intake-api-ci.yml'
  workflow_dispatch:

defaults:
  run:
    working-directory: intake-api

jobs:
  pip-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install package + pip-audit
        run: |
          python -m pip install -U pip
          pip install -e .
          pip install pip-audit
          pip-audit
