[project]
name = "lexiatek-intake-api"
version = "0.1.0"
description = "Widget intake LexiaTek → HubSpot via OpenAI Agents SDK"
requires-python = ">=3.11"
dependencies = [
    "openai-agents>=0.16,<0.18",
    "openai>=1.68.0,<2.45",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "httpx>=0.28.0",
    "pydantic-settings>=2.7.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3.0", "pytest-asyncio>=0.25.0"]

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
